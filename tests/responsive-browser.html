<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>390px meeting layout check</title><style>body{margin:0;padding:8px;background:#e8edf3;font:12px system-ui}p{margin:0 0 6px}iframe{width:390px;height:844px;border:1px solid #bbc5d2;display:block;background:white}</style><p>실제 휴대폰이 아닌 390 × 844 CSS 뷰포트 검증</p><iframe src="/" title="390px 회의 화면"></iframe></html>
<script>const p=new URLSearchParams(location.search),frame=document.querySelector('iframe');const w=Math.max(320,Math.min(2560,Number(p.get('width'))||390)),h=Math.max(360,Math.min(1200,Number(p.get('height'))||844));frame.style.width=w+'px';frame.style.height=h+'px';document.querySelector('p').textContent='브라우저 프레임 검증 '+w+' × '+h;</script>
